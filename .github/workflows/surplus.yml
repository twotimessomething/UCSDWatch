name: UCSD Surplus watch

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (UTC); GitHub may delay a few min
  workflow_dispatch:          # lets you trigger it by hand from the Actions tab

permissions:
  contents: write             # needed to commit seen.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check.py

      - name: Save state
        run: |
          git config user.name  "surplus-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "update seen listings"
          git push
